name: Approved production release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: android-actions/setup-android@v3
      - run: mvn --batch-mode package
      - run: chmod +x android-app/gradlew
      - name: Validate production API URL
        env:
          PRODUCTION_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
        run: test -n "${PRODUCTION_API_BASE_URL}"
      - working-directory: android-app
        env:
          DISCOVER_VANCOUVER_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
        run: ./gradlew test lint assembleRelease
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/discover-vancouver-backend:${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.version }}
          path: |
            target/*.jar
            android-app/app/build/outputs/apk/release/*.apk
