services:
  api:
    build:
      context: .
    image: discover-vancouver-api:${IMAGE_TAG:-local}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      WEATHER_BASE_URL: ${WEATHER_BASE_URL:-https://api.open-meteo.com/v1}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      SERVER_PORT: 8080
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/actuator/health/readiness
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
