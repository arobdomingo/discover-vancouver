plugins {
    id "com.android.application"
}

def releaseApiBaseUrl = providers.environmentVariable(
    "DISCOVER_VANCOUVER_API_BASE_URL"
).orElse("https://api.example.invalid/").get()

def mapStyleUrl = providers.environmentVariable(
    "DISCOVER_VANCOUVER_MAP_STYLE_URL"
).orElse("https://tiles.openfreemap.org/styles/liberty").get()

android {
    namespace "com.discovervancouver.mobile"
    compileSdk 37

    defaultConfig {
        applicationId "com.discovervancouver.mobile"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField "String", "API_BASE_URL", '"http://10.0.2.2:8080/"'
            buildConfigField "String", "MAP_STYLE_URL", "\"${mapStyleUrl}\""
        }
        release {
            buildConfigField "String", "API_BASE_URL", "\"${releaseApiBaseUrl}\""
            buildConfigField "String", "MAP_STYLE_URL", "\"${mapStyleUrl}\""
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all {
            systemProperty(
                "e2e.response.file",
                System.getProperty("e2e.response.file", "")
            )
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity:1.11.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "com.google.android.material:material:1.13.0"
    implementation "org.maplibre.gl:android-sdk:13.7.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.10"

    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "org.json:json:20240303"

    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
}
