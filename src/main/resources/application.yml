spring:
  application:
    name: discover-vancouver-backend
  profiles:
    default: dev
  data:
    mongodb:
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

app:
  time-zone: ${APP_TIME_ZONE:America/Vancouver}
  recommendation:
    default-limit: ${RECOMMENDATION_DEFAULT_LIMIT:10}
    maximum-limit: ${RECOMMENDATION_MAXIMUM_LIMIT:50}
    weights:
      category: ${RECOMMENDATION_WEIGHT_CATEGORY:25}
      indoor: ${RECOMMENDATION_WEIGHT_INDOOR:15}
      open-now: ${RECOMMENDATION_WEIGHT_OPEN_NOW:20}
      budget: ${RECOMMENDATION_WEIGHT_BUDGET:10}
      atmosphere: ${RECOMMENDATION_WEIGHT_ATMOSPHERE:12}
      rainy-indoor: ${RECOMMENDATION_WEIGHT_RAINY_INDOOR:10}
      rainy-day-tag: ${RECOMMENDATION_WEIGHT_RAINY_DAY_TAG:10}
      time-of-day: ${RECOMMENDATION_WEIGHT_TIME_OF_DAY:8}
      distance-maximum: ${RECOMMENDATION_WEIGHT_DISTANCE_MAXIMUM:20}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
  import:
    file: ${PLACE_IMPORT_FILE:}
    source: ${PLACE_IMPORT_SOURCE:}
  place-sources:
    batch-size: ${PLACE_IMPORT_BATCH_SIZE:500}
    report-file: ${PLACE_QUALITY_REPORT_FILE:output/place-data-quality-report.json}
    foursquare:
      enabled: ${FOURSQUARE_OPEN_PLACES_ENABLED:false}
      file: ${FOURSQUARE_OPEN_PLACES_FILE:}
      min-latitude: ${PLACES_MIN_LATITUDE:49.0}
      max-latitude: ${PLACES_MAX_LATITUDE:49.5}
      min-longitude: ${PLACES_MIN_LONGITUDE:-123.5}
      max-longitude: ${PLACES_MAX_LONGITUDE:-122.5}
    vancouver:
      enabled: ${VANCOUVER_OPEN_DATA_ENABLED:false}
      base-url: ${VANCOUVER_OPEN_DATA_BASE_URL:https://opendata.vancouver.ca}
      page-size: ${VANCOUVER_OPEN_DATA_PAGE_SIZE:100}
      connect-timeout: ${VANCOUVER_OPEN_DATA_CONNECT_TIMEOUT:5s}
      read-timeout: ${VANCOUVER_OPEN_DATA_READ_TIMEOUT:20s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mongodb:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
